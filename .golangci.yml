# golangci-lint v2 config — start conservative, expand once baseline is clean
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # Default linter set is govet+errcheck+ineffassign+staticcheck+unused.
  # We explicitly add misspell + gocyclo on top. gosimple folded into staticcheck in v2.
  enable:
    - errcheck       # checks unchecked errors
    - govet          # standard vet
    - ineffassign    # ineffective assignments
    - staticcheck    # bug detection (subsumes gosimple in v2)
    - unused         # unused code
    - misspell       # spelling
    - gocyclo        # cyclomatic complexity
  settings:
    gocyclo:
      min-complexity: 20
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocyclo
      # SA5011 (possible nil pointer dereference) in test files fires on the
      # idiomatic `got := f(); if got == nil { t.Fatalf(...) }; got.X` pattern —
      # a nil deref in a test panics and fails loudly, so it carries no
      # production signal. Suppressed by-check in _test.go only; production
      # SA5011 still fails the build. golangci's analysis cache masks these
      # until a cache-busting change (e.g. a go.mod bump) re-analyses.
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA5011"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
